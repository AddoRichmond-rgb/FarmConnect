{% extends 'farmer/_layout.html' %}
{% set heading = 'Edit product' if product else 'Add a product' %}
{% set sub = 'Every submission goes to the administrator for review before publishing.' %}
{% block panel %}
<form class="card form" method="post" enctype="multipart/form-data" novalidate data-validate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field"><label for="name">Product name</label>
    <input id="name" name="name" required minlength="3" maxlength="160"
           value="{{ product.name if product else form.get('name','') }}"></div>

  <div class="two-col">
    <div class="field"><label for="category_id">Category</label>
      <select id="category_id" name="category_id" required>
        {% for c in categories %}
          <option value="{{ c.id }}" {% if product and product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select></div>
    <div class="field"><label for="unit">Unit</label>
      <select id="unit" name="unit">
        {% for u in ['kg','bag','crate','litre','piece'] %}
          <option value="{{ u }}" {% if product and product.unit == u %}selected{% endif %}>{{ u }}</option>
        {% endfor %}
      </select></div>
  </div>

  <div class="two-col">
    <div class="field"><label for="price">Price (GHS)</label>
      <input id="price" name="price" type="number" step="0.01" min="0.01" required
             value="{{ product.price if product else form.get('price','') }}"></div>
    <div class="field"><label for="quantity">Quantity available</label>
      <input id="quantity" name="quantity" type="number" min="0" required
             value="{{ product.quantity if product else form.get('quantity','') }}"></div>
  </div>

  <div class="field"><label for="location">Farm location</label>
    <input id="location" name="location" maxlength="140"
           value="{{ product.location if product else form.get('location','') }}"></div>

  <div class="field"><label for="description">Description</label>
    <textarea id="description" name="description" rows="5" maxlength="2000">{{ product.description if product else '' }}</textarea></div>

  <div class="field"><label for="image">Main image (PNG, JPG, WEBP — max 5 MB)</label>
    <input id="image" name="image" type="file" accept="image/*"></div>
  <div class="field"><label for="gallery">Extra images</label>
    <input id="gallery" name="gallery" type="file" accept="image/*" multiple></div>

  <button class="btn btn-primary btn-lg" type="submit">
    {{ 'Save and resubmit' if product else 'Submit for approval' }}</button>
</form>
{% endblock %}
