{% extends 'customer/_layout.html' %}
{% set heading = 'My profile' %}
{% block panel %}
<form class="card form" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <h3>Account details</h3>
  <div class="two-col">
    <div class="field"><label for="full_name">Full name</label>
      <input id="full_name" name="full_name" value="{{ user.full_name }}" required></div>
    <div class="field"><label for="phone">Phone</label>
      <input id="phone" name="phone" value="{{ user.phone or '' }}"></div>
  </div>
  <div class="two-col">
    <div class="field"><label for="address">Delivery address</label>
      <input id="address" name="address" value="{{ (user.customer.address if user.customer else '') or '' }}"></div>
    <div class="field"><label for="city">City</label>
      <input id="city" name="city" value="{{ (user.customer.city if user.customer else '') or '' }}"></div>
  </div>
  <button class="btn btn-primary" type="submit">Save profile</button>
</form>

<form class="card form" method="post" action="{{ url_for('auth.change_password') }}" data-validate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <h3>Change password</h3>
  <div class="field"><label for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password" required></div>
  <div class="two-col">
    <div class="field"><label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password" required minlength="8"></div>
    <div class="field"><label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password" required minlength="8"></div>
  </div>
  <button class="btn btn-primary" type="submit">Update password</button>
</form>
{% endblock %}
