{% extends 'base.html' %}
{% block title %}Login — FarmConnect{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="container auth-grid">
  <div class="auth-art">
    <h2>Welcome back</h2>
    <p>Sign in to manage your harvest, your cart or the whole marketplace.</p>
  </div>
  <form class="card form" method="post" novalidate data-validate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Log in</h1>
    <div class="field"><label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email }}" required></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8"></div>
    <button class="btn btn-primary btn-lg full" type="submit">Log in</button>
    <p class="muted small center">New here?
      <a class="link" href="{{ url_for('auth.register') }}">Create an account</a></p>
  </form>
</div></section>
{% endblock %}
